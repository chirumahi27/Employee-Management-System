{% extends "employees/base.html" %}
{% block title %}Delete Employee{% endblock %}
{% block content %}
<h1>Delete Employee</h1>
<p>Are you sure you want to delete <strong>{{ employee.name }}</strong>?</p>
<p class="muted">This action cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button class="button danger" type="submit">Yes, Delete</button>
    <a class="secondary" href="{% url 'employee_list' %}">Cancel</a>
</form>
{% endblock %}
